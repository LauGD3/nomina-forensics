services:
  db:
    image: mysql:8.0
    container_name: nomina-db
    # native_password: compatible con todos los clientes (incluido el de Bun)
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nomina
      MYSQL_USER: forense
      MYSQL_PASSWORD: forense
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uforense -pforense --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysqldata:
